<!doctype html><html lang="zh-Hant"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>星光隧道 · 原創跑跳遊戲</title><link rel="stylesheet" href="game.css?v=polish4"><body><main><header><button id="leave" aria-label="返回學堂">← 學堂</button><strong>✦ 星光隧道</strong><button id="music" aria-label="遊戲音樂開關" aria-pressed="true">♫ 音樂</button><button id="pause" disabled>暫停</button></header><section class="stage"><canvas tabindex="0" id="game" aria-label="八面星光隧道跑跳遊戲"></canvas><div class="hud" aria-live="off"><span><small>距離</small><b id="distance">0</b> m</span><span><small>星星</small>✦ <b id="stars">0</b></span><span><small>關卡</small><b id="level">1</b></span></div><div id="overlay" class="overlay"><div class="intro"><span class="badge">ORIGINAL GAME · 遊戲 01</span><h1>跑進星光，<br>勇敢踏出下一步。</h1><p id="message">男仔主角準備好喇！<br>背向前跑！左右轉面、跳過缺口，挑戰更快節奏。</p><div class="help"><span>← → 轉換表面</span><span>空白鍵／↑ 跳躍</span><span>長按跳得更遠</span></div><p class="record">最佳紀錄 <b id="best">0</b> m</p><button id="start" class="primary">開始冒險 →</button></div></div><div id="milestone" class="milestone" aria-live="polite"></div></section><footer><button id="left" aria-label="向左轉換表面">◀</button><button id="jump" class="jump">跳躍 ⤴</button><button id="right" aria-label="向右轉換表面">▶</button></footer><p class="tip">轉面有少少緩衝時間；見到缺口，可以補跳或轉返安全位置。</p></main><script type="module" src="game.mjs?v=polish4"></script></body></html>
